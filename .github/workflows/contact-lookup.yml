name: contact-lookup
on:
  push:
    branches: [claude/timewave-zero-ownership-fwhn59]
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Public commit metadata and profile links
        run: |
          set +e
          sec(){ echo; echo "=================== $1 ==================="; }
          for r in AEON-7 cosmic-mind Aeon-Bench-Pod aeon-magick-ai-computer-control vllm-ultimate-dgx-spark; do
            sec "COMMITS $r"
            curl -sS -m 30 -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/AEON-7/$r/commits?per_page=30" | jq -r '.[]? | [.commit.author.name, .commit.author.email, .commit.author.date[0:10], (.author.login // "-")] | @tsv' | sort | uniq -c | sort -rn | head -8
          done
          sec "HF PROFILE LINKS"
          curl -sS -m 30 -L https://huggingface.co/AEON-7 -o hf.html -w 'code %{http_code}\n'
          grep -oiE 'href="https?://[^"]+"' hf.html | grep -viE 'huggingface\.co|hf\.co|/static|apple\.com|google\.com|github\.com/huggingface|twitter\.com/huggingface|linkedin\.com/company/hugging' | sort -u | head -20
          grep -oiE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[a-z]{2,}' hf.html | sort -u | head
          sec "DONE"
