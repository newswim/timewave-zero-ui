name: avenues
on:
  push:
    branches: [claude/timewave-zero-ownership-fwhn59]
jobs:
  avenues:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Public lookups
        env:
          UA: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125 Safari/537.36"
        run: |
          set +e
          sec(){ echo; echo "=================== $1 ==================="; }
          sec "ENS reverse (published ETH tip address)"
          curl -sS -m 20 "https://api.ensideas.com/ens/resolve/0x1512667F6D61454ad531d2E45C0a5d1fd82D0500"; echo
          curl -sS -m 20 "https://ensdata.net/0x1512667F6D61454ad531d2E45C0a5d1fd82D0500" | head -c 600; echo
          sec "HF user overview API"
          curl -sS -m 20 "https://huggingface.co/api/users/AEON-7/overview" | jq -c '{user,fullname,details,websiteUrl,twitterUsername,githubUsername,isPro,orgs:[.orgs[]?.name],numFollowers,createdAt}' 2>/dev/null || true
          sec "X profile (syndication API)"
          curl -sS -m 20 -A "$UA" "https://cdn.syndication.twimg.com/widgets/followbutton/info.json?screen_names=SpaceTimeViking" | head -c 800; echo
          curl -sS -m 30 -A "$UA" "https://syndication.twitter.com/srv/timeline-profile/screen-name/SpaceTimeViking" -o tl.html -w 'code %{http_code}\n'
          grep -oE '"(name|screen_name|location|description|created_at|url|expanded_url)":"[^"]{1,200}"' tl.html | sort | uniq -c | sort -rn | head -25
          sec "Discord invite on Cosmic Mind site"
          curl -sS -m 20 "https://discord.com/api/v10/invites/cRFFHYye7t?with_counts=true" | jq -c '{guild:.guild.name,guild_desc:.guild.description,inviter:.inviter.username,inviter_global:.inviter.global_name,channel:.channel.name,members:.approximate_member_count}' 2>/dev/null || true
          sec "Cosmic Mind published vault index (Quartz)"
          curl -sS -m 30 -A "$UA" -L "https://as-within-so-without.com/static/contentIndex.json" -o ci.json -w 'code %{http_code}\n'
          jq -r 'to_entries[] | .value.title' ci.json 2>/dev/null | head -80
          jq -r 'to_entries[] | select(.value.title|test("about|me|who|bio|contact|resume|cv|journal|diary";"i")) | "\(.key) :: \(.value.title)"' ci.json 2>/dev/null | head -20
          jq -r 'to_entries[] | .value.content' ci.json 2>/dev/null | grep -oiE ".{0,80}\b(my name is|i am [A-Z][a-z]+ [A-Z][a-z]+|i'm [A-Z][a-z]+ [A-Z][a-z]+|born in|i live in|raleigh|charlotte|durham|asheville|greensboro|wilmington|north carolina|nc\b).{0,80}" | sort -u | head -20
          sec "Patreon page"
          curl -sS -m 30 -A "$UA" -L "https://www.patreon.com/AeonForge7" -o pt.html -w 'code %{http_code}\n'
          grep -oE '"(full_name|name|vanity|creation_name|url|patron_count|created_at)":"[^"]{1,120}"' pt.html | sort -u | head -20
          grep -oiE '<title>[^<]+</title>|<meta name="description" content="[^"]+"' pt.html | head -3
          sec "aeon-bench.com leaderboard names"
          curl -sS -m 30 -A "$UA" -L "https://aeon-bench.com/" -o ab.html -w 'code %{http_code}\n'
          grep -oiE 'submitted by[^<]{0,80}|@[A-Za-z0-9_]{3,30}|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[a-z]{2,}' ab.html | sort -u | head -15
          for e in api/leaderboard api/submissions api/runs leaderboard.json; do echo "## /$e"; curl -sS -m 20 -A "$UA" "https://aeon-bench.com/$e" | head -c 500; echo; done
          sec "YouTube videos embedded in the McKenna tab"
          curl -sS -m 30 -A "$UA" https://timewave-zero.com/assets/index-DWbbLQ8H.js -o b.js
          i=$(grep -bo 'McKennaArchiveTab' b.js | head -1 | cut -d: -f1); echo "anchor offset: $i"
          if [ -n "$i" ]; then s=$((i>60000?i-60000:0)); dd if=b.js bs=1 skip=$s count=120000 2>/dev/null > seg.js; else cp b.js seg.js; fi
          grep -oE '(id|videoId|yt|v|video)\s*:\s*"[A-Za-z0-9_-]{11}"' seg.js | grep -oE '[A-Za-z0-9_-]{11}"' | tr -d '"' | sort -u > ids.txt
          [ -s ids.txt ] || grep -oE '"[A-Za-z0-9_-]{11}"' seg.js | tr -d '"' | grep -E '[0-9]' | sort -u | head -60 > ids.txt
          echo "candidate ids: $(wc -l < ids.txt)"
          n=0; while read -r id; do [ $n -ge 45 ] && break; n=$((n+1)); r=$(curl -sS -m 15 "https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=$id&format=json"); [ -n "$r" ] && echo "$r" | jq -r --arg id "$id" '"\($id)\t\(.author_name)\t\(.title)"' 2>/dev/null; done < ids.txt
          sec "Titles/labels in the McKenna tab segment"
          grep -oE '(title|label|name)\s*:\s*"[^"]{8,120}"' seg.js | sort -u | head -60
          sec "Old unhash.me about page (2018, likely a previous owner)"
          curl -sS -m 40 -L "https://web.archive.org/web/20180828032941id_/http://unhash.me/about" | sed -e 's/<[^>]*>/ /g' | tr -s ' \n' | head -c 1200; echo
          sec "DONE"
